{% extends "base.html" %}

{% block title %}حذف مهارت — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4 text-center">
            <div class="empty-icon text-danger">
              <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            </div>
            <h1 class="h4 mb-2">حذف «{{ skill.title }}»</h1>
            <p class="text-muted-2">
              این عملیات قابل بازگشت نیست. با حذف این مهارت،
              {{ skill.exchanges.count }} درخواست تبادل مرتبط با آن نیز حذف می‌شود.
            </p>

            <form method="post" class="d-flex gap-2 justify-content-center mt-4">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger">بله، حذف شود</button>
              <a class="btn btn-outline-secondary" href="{{ skill.get_absolute_url }}">انصراف</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
