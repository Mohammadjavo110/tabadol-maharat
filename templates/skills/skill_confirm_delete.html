{% extends "base.html" %}

{% block title %}حذف مهارت — {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="section py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card">
          <div class="pt-3">
            <h1 class="h5 fw-bold mb-2">حذف «{{ skill.title }}»</h1>
            <p class="ink-2">
              این کار برگشت‌پذیر نیست. با حذف، درخواست‌های تبادل مرتبط با این مهارت
              هم پاک می‌شوند.
            </p>
            <form method="post" class="d-flex gap-2 mt-4">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger">بله، حذف کن</button>
              <a class="btn btn-outline-secondary" href="{{ skill.get_absolute_url }}">انصراف</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
